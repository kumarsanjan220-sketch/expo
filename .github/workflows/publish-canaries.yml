name: Publish Canaries

on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - .github/workflows/publish-canaries.yml
  schedule:
    - cron: 0 1 * * * # Nightly at 1:00 AM UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-canaries:
    runs-on: ubuntu-24.04
    env:
      NODE_AUTH_TOKEN: ${{ secrets.EXPO_BOT_NPM_TOKEN }}
    steps:
      - name: 👀 Checkout
        uses: actions/checkout@v4
      - name: ⬢ Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
      - name: 🔨 Use JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Test
        run: exit 1
      # - name: ♻️ Restore caches
      #   uses: ./.github/actions/expo-caches
      #   id: expo-caches
      #   with:
      #     yarn-workspace: 'true'
      #     yarn-tools: 'true'
      # - name: 🧶 Install workspace node modules
      #   if: steps.expo-caches.outputs.yarn-workspace-hit != 'true'
      #   run: yarn install --frozen-lockfile
      # - name: 🧶 Install modules in tools dir
      #   if: steps.expo-caches.outputs.yarn-tools-hit != 'true'
      #   run: yarn install --ignore-scripts --frozen-lockfile
      #   working-directory: tools
      # - name: 📦 Publish canaries
      #   run: ./bin/expotools publish-packages --canary ${{ github.event_name != 'workflow_dispatch' && '--dry' || '' }}
      #   env:
      #     FORCE_COLOR: '2'
      - name: 🔔 Notify on Slack
        uses: slackapi/slack-github-action@v2.1.1
        # if: failure() && github.event_name == 'schedule'
        with:
          webhook: ${{ secrets.slack_webhook_api }}
          webhook-type: incoming-webhook
          payload: |
            text: "Publish Canaries - ${{ job.status }}"
            blocks:
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "*Publish Canaries*\n*Status:* ${{ job.status }}\n*Job:* ${{ github.job }}\n*Author:* ${{ github.actor }}\n*Message:* ${{ github.event.head_commit.message || 'No commit message' }}\n*Repository:* ${{ github.repository }}\n*Workflow:* ${{ github.workflow }}\n*Run:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|#${{ github.run_number }}>"
