name: 'Slack Notify Job'
description: 'Send formatted job notifications to Slack (replacement for 8398a7/action-slack)'
inputs:
  webhook:
    description: 'Slack webhook URL'
    required: true
  author_name:
    description: 'Author name to display in notification'
    required: false
    default: 'GitHub Actions'
  job_name:
    description: 'Job name to display (defaults to github.job)'
    required: false
    default: ${{ github.job }}
  github_token:
    description: 'GitHub token for API calls'
    required: true
  status:
    description: 'Job status (success, failure, cancelled)'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Gather job details
      id: details
      uses: actions/github-script@v7
      env:
        JOB_NAME: ${{ inputs.job_name }}
        JOB_STATUS: ${{ inputs.status }}
      with:
        github-token: ${{ inputs.github_token }}
        script: |
          const { owner, repo } = context.repo;
          const { sha } = context;

          // Fetch commit details
          const commit = await github.rest.repos.getCommit({
            owner,
            repo,
            ref: sha
          });

          // Format message field (first line only, HTML escaped, linked)
          const commitMessage = commit.data.commit.message
            .split('\n')[0]
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;');
          const messageField = `<${commit.data.html_url}|${commitMessage}>`;

          // Format author field
          const author = commit.data.commit.author;
          const authorField = `${author.name} <${author.email}>`;

          // Fetch job details
          const jobs = await github.paginate(
            github.rest.actions.listJobsForWorkflowRun,
            {
              owner,
              repo,
              run_id: context.runId
            }
          );

          const jobName = process.env.JOB_NAME;
          const currentJob = jobs.find(job =>
            job.name === jobName || job.name.endsWith(` / ${jobName}`)
          );

          let jobField = 'Job not found';
          let tookField = 'N/A';

          if (currentJob) {
            // Format job field with link
            jobField = `<${process.env.GITHUB_SERVER_URL || 'https://github.com'}/${owner}/${repo}/runs/${currentJob.id}|${jobName}>`;

            // Calculate duration
            const startTime = new Date(currentJob.started_at).getTime();
            const endTime = new Date().getTime();
            let duration = endTime - startTime;

            const hours = Math.floor(duration / (1000 * 60 * 60));
            duration -= hours * 1000 * 60 * 60;
            const minutes = Math.floor(duration / (1000 * 60));
            duration -= minutes * 1000 * 60;
            const seconds = Math.floor(duration / 1000);

            let tookParts = [];
            if (hours > 0) tookParts.push(`${hours} hour`);
            if (minutes > 0) tookParts.push(`${minutes} min`);
            if (seconds > 0) tookParts.push(`${seconds} sec`);
            tookField = tookParts.join(' ') || '0 sec';
          }

          // Determine color based on status
          const status = process.env.JOB_STATUS.toLowerCase();
          let color = 'danger'; // default to red
          if (status === 'success') color = 'good'; // green
          if (status === 'cancelled') color = 'warning'; // yellow

          // Set outputs
          core.setOutput('message', messageField);
          core.setOutput('author', authorField);
          core.setOutput('job', jobField);
          core.setOutput('took', tookField);
          core.setOutput('color', color);

    - name: Send to Slack
      uses: slackapi/slack-github-action@v2.1.1
      shell: bash
      with:
        webhook: ${{ inputs.webhook }}
        webhook-type: incoming-webhook
        payload: |
          text: "${{ inputs.author_name }}"
          attachments:
            - color: "${{ steps.details.outputs.color }}"
              author_name: "${{ inputs.author_name }}"
              fields:
                - title: "message"
                  value: "${{ steps.details.outputs.message }}"
                  short: true
                - title: "author"
                  value: "${{ steps.details.outputs.author }}"
                  short: true
                - title: "job"
                  value: "${{ steps.details.outputs.job }}"
                  short: true
                - title: "took"
                  value: "${{ steps.details.outputs.took }}"
                  short: true
